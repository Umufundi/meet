[project]
name = "meet"
# The terminal meeting identity tool. The core answers "who is speaking?" and
# asks a human when it cannot. It deliberately carries NO machine-learning
# dependency: perception (audio -> text + voice vector) lives in the `listener`
# sidecar, reached only across a process boundary over NDJSON. That boundary is
# the lesson from silverstein/minutes, whose live diarizer had to be exiled to
# its own cargo workspace because ort/ndarray versions could not coexist with
# the host. Keeping judgment free of torch means the loop below stays testable,
# fast to start, and replaceable engine by engine.
version = "0.1.0"
description = "Who is speaking, resolved live, taught by a human."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "textual>=1.0",
    "numpy>=2.1",
    "httpx[http2]>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
meet = "meet.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meet"]

# `meet setup` installs the listener from these, so an installed Meet does not
# depend on the git checkout it was built from.
[tool.hatch.build.targets.wheel.force-include]
"listener/meet_listen" = "meet/_listener/meet_listen"
"listener/pyproject.toml" = "meet/_listener/pyproject.toml"
"listener/requirements.lock" = "meet/_listener/requirements.lock"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["meet", "meet_listen", "tests"]
