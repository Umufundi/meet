[project]
# The perception sidecar. It owns the microphone, the ASR, and the speaker
# embedding model, and it exposes exactly one thing to the rest of the system:
# a line of JSON per settled utterance, carrying text plus an L2-normalized
# voice vector. It holds no meeting state, no database, and no opinion about
# who anyone is. Keeping torch and CTranslate2 behind a process boundary is
# what lets the core start in milliseconds and stay swappable.
name = "meet-listen"
license = "Apache-2.0"
version = "0.1.0"
# The lock is verified for exactly these; a newer Python needs a new check.
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.1",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "faster-whisper>=1.1",
    "speechbrain>=1.0",
    # torch and torchaudio ship as a matched pair; a mismatched minor fails at
    # import inside torchaudio's native extension. torchaudio stopped at 2.11.
    "torch>=2.5,<2.12",
    "torchaudio>=2.5,<2.12",
    "silero-vad>=5.1",
    # Apple Silicon Macs on macOS 12+. Both are pulled in by faster-whisper and
    # barely used (its own VAD is off, and it gets arrays, not files to decode),
    # but newer releases only ship wheels for macOS 13/14+. scipy (speechbrain)
    # sets the macOS 12 floor. onnxruntime < 1.20 has no Python 3.13 wheels, so
    # 3.13 gets 1.20-1.23 (macOS 13+). Check every package's wheels for BOTH
    # Python versions before lifting these.
    "onnxruntime>=1.16,<1.20; python_version < '3.13'",
    "onnxruntime>=1.20,<1.24; python_version >= '3.13'",
    "av>=11,<14.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meet_listen"]
